name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Maven -Dtest selector (empty runs the full suite)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: Report skipped tests
        if: always()
        run: |
          echo "Skipped tests (from surefire XML reports):"
          for f in */target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for tc in root.iter('testcase'):
              s = tc.find('skipped')
              if s is not None:
                  reason = s.get('message') or (s.text or '').strip() or 'no message recorded'
                  print("SKIPPED: %s.%s -- reason: %s" % (tc.get('classname'), tc.get('name'), reason))
          EOF
          done
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-*.jar
          if-no-files-found: error
